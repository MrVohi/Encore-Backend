name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./cmd/api

      - name: Docker build
        run: docker build .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "TODO: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN"

      - name: Build and push image
        run: echo "TODO: docker build -t <image> . && docker push <image>"

      - name: Run migrations
        run: echo "TODO: ./app migrate"

      - name: Deploy to Azure Container Apps
        run: echo "TODO: az containerapp update ..."
