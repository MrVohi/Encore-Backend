name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - prod/deploy-setup

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./cmd/api

      - name: Docker build (sanity)
        run: docker build .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    env:
      IMAGE_REPO: mrvohi/encore-backend
      RG: rg-encore-prod
      LOCATION: francecentral
      ACI_NAME: encore-backend
      DNS_LABEL: encore-backend-ynov
      PORT: "8080"
      CPU: "1"
      MEMORY: "1.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----- Build + push image to Docker Hub -----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ env.IMAGE_REPO }}:prod
            docker.io/${{ env.IMAGE_REPO }}:${{ github.sha }}

      # ----- Run DB migrations (Neon) -----
      - name: Set up Go (for migrations)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run migrations against Neon
        env:
          POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}
        run: |
          go run ./cmd/migrate/main.go

      # ----- Redeploy Azure Container Instances (ACI) -----
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Redeploy ACI container group
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          # Runtime env for your app:
          POSTGRES_URL: ${{ secrets.NEON_POSTGRES_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_ENVIRONMENT: production
        run: |
          set -euo pipefail

          IMAGE="docker.io/${IMAGE_REPO}:${GITHUB_SHA}"

          # Delete old group if it exists (simplest reliable "update")
          if az container show -g "${RG}" -n "${ACI_NAME}" >/dev/null 2>&1; then
            az container delete -g "${RG}" -n "${ACI_NAME}" --yes
            # wait for deletion
            for i in {1..60}; do
              if ! az container show -g "${RG}" -n "${ACI_NAME}" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
          fi

          az container create \
            -g "${RG}" \
            -n "${ACI_NAME}" \
            -l "${LOCATION}" \
            --image "${IMAGE}" \
            --os-type Linux \
            --cpu "${CPU}" \
            --memory "${MEMORY}" \
            --ip-address Public \
            --ports "${PORT}" \
            --dns-name-label "${DNS_LABEL}" \
            --restart-policy OnFailure \
            --registry-login-server index.docker.io \
            --registry-username "${DOCKERHUB_USERNAME}" \
            --registry-password "${DOCKERHUB_TOKEN}" \
            --environment-variables \
              APP_ENV=production \
              GIN_MODE=release \
              ADDR=0.0.0.0:${PORT} \
              FRONTEND_URL="${FRONTEND_URL}" \
              SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT}" \
            --secure-environment-variables \
              POSTGRES_URL="${POSTGRES_URL}" \
              JWT_SECRET="${JWT_SECRET}" \
              SENTRY_DSN="${SENTRY_DSN}"
